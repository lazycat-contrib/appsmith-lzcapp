name: Verify Appsmith Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v2.6.0
permissions:
  contents: read
concurrency:
  group: appsmith-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.appsmith-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.appsmith', info['package']
              assert info['name'] == 'Appsmith', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'Apache-2.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              raw = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(raw)
              app = m['application']
              assert app['subdomain'] == 'appsmith', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and 'appsmith:80' in (u.get('backend') or '')
                         for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'appsmith'}, set(svcs)
              svc = svcs['appsmith']
              assert 'appsmith/appsmith-ce' in svc['image'], svc['image']
              # the upstream tag keeps its "v" prefix while package.yml carries the
              # plain numeric version, so compare against the tag verbatim
              assert svc['image'].endswith(':' + tag), svc['image']

              env = ' '.join(str(x) for x in svc['environment'])
              # the upstream compose ships "abcd" for both; that would leave
              # every stored datasource credential decryptable by anyone
              assert 'APPSMITH_ENCRYPTION_PASSWORD=' in env, env
              assert 'APPSMITH_ENCRYPTION_SALT=' in env, env
              assert 'stable_secret' in env, 'encryption keys must not be literals'
              assert re.search(r'APPSMITH_ENCRYPTION_PASSWORD=[^\n]*abcd', env) is None, \
                  'weak upstream placeholder password in use'
              assert re.search(r'APPSMITH_ENCRYPTION_SALT=[^\n]*abcd', env) is None, \
                  'weak upstream placeholder salt in use'
              # a protocol-bearing value is discarded upstream, and a bare domain
              # makes the built-in Caddy request its own certificate
              assert 'APPSMITH_CUSTOM_DOMAIN=' not in env, \
                  'custom domain must stay empty behind the ingress'
              assert 'APPSMITH_DISABLE_TELEMETRY=true' in env, env

              assert any(b.endswith(':/appsmith-stacks') for b in svc['binds']), svc['binds']

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              assert params['params'] == [], params
              refs = set(re.findall(r'\.U\.([A-Za-z0-9_]+)', raw))
              assert refs == set(), ('unexpected deploy param refs', refs)

              assert 'healthcheck' not in svc, svc
              assert 'lzc-file-chooser' not in raw
              assert 'usage' in m and str(m['usage']).strip(), 'usage section missing'
              usage_text = str(m['usage'])
              assert ('真机验证' in usage_text or '实机验证' in usage_text), 'usage must state no device test'

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
                  flat = ' '.join(license_text.split())
                  assert 'Apache License' in flat and 'Version 2.0' in flat, flat[:150]

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
              'note': 'single container with bundled MongoDB and PostgreSQL; first signup becomes instance admin',
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
